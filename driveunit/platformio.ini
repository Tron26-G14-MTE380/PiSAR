[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

build_unflags = 
    -std=gnu++17

build_flags = 
    -std=gnu++20

extra_scripts = pre:extra_script.py
monitor_speed = 115200

; Optional settings for additional libraries or configurations
lib_deps =
    ; Example library dependencies
    ; <Library name> == <Library version>
    ; Thirdparty libraries
    symlink://../thirdparty/optional
    symlink://../thirdparty/span
    symlink://../thirdparty/variant
    
    ; Project Libraries
    symlink://../driveunit_interface

